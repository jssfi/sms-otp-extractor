name: Release APKs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release-apks:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    environment: release-signing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"

      - name: Decode signing keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify bundled model was fetched
        run: |
          test -s app/src/bundled/assets/models/SmolLM2_135M_Instruct.litertlm
          bytes=$(wc -c < app/src/bundled/assets/models/SmolLM2_135M_Instruct.litertlm)
          test "$bytes" -gt 100000000

      - name: Build signed release APKs
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/signing/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleAllRelease --console=plain

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/bundled/release/app-bundled-release.apk "release-assets/sms-otp-${GITHUB_REF_NAME}-bundled.apk"
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "release-assets/sms-otp-${GITHUB_REF_NAME}-lite.apk"

      - name: Verify release APK model split
        run: |
          unzip -l release-assets/sms-otp-${GITHUB_REF_NAME}-bundled.apk | grep 'assets/models/SmolLM2_135M_Instruct.litertlm'
          if unzip -l release-assets/sms-otp-${GITHUB_REF_NAME}-lite.apk | grep 'assets/models/'; then
            echo "Lite APK unexpectedly contains model assets"
            exit 1
          fi

      - name: Upload APKs to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/*.apk --clobber
